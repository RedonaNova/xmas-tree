<!DOCTYPE html>
<html lang="mn">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta property="og:title" content="Merry Christmas!" />
  <meta property="og:description" content="Өөрийн зургуудаар чимэглэсэн 3D гацуур мод" />
  <title>Merry Christmas!</title>
  <meta name="description" content="Өөрийн зургуудаар чимэглэсэн 3D гацуур мод" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Great Vibes: "Merry Christmas" only (it lacks Mongolian Ө/Ү).
       Bad Script (names) and Montserrat (UI) cover full Mongolian Cyrillic. -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Bad+Script&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #050505;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Touch gestures on the 3D scene rotate/zoom the tree instead of the page */
    canvas {
      touch-action: none;
    }

    #root {
      width: 100%;
      height: 100%;
    }

    /* Custom scrollbar for aesthetic */
    ::-webkit-scrollbar {
      width: 0px;
    }

    @keyframes shrink {
      from {
        width: 100%;
      }

      to {
        width: 0%;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
